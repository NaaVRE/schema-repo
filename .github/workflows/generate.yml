name: Generate Models & Docs

on:
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "openapi/**"
      - "generators/**"
  pull_request:
    paths:
      - "schemas/**"
      - "openapi/**"
      - "generators/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-python:
    name: Generate Python Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install datamodel-code-generator
        run: pip install "datamodel-code-generator>=0.25"

      - name: Generate Python models
        run: bash generators/generate_python.sh

      - name: Upload Python models artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-models
          path: packages/python-models/

      - name: Commit generated Python models
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/python-models/src/
          git diff --cached --quiet || git commit -m "chore: regenerate Python models [skip ci]"
          git push

  generate-typescript:
    name: Generate TypeScript Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install json-schema-to-typescript
        run: npm install -g json-schema-to-typescript

      - name: Generate TypeScript types
        run: bash generators/generate_typescript.sh

      - name: Upload TypeScript types artifact
        uses: actions/upload-artifact@v4
        with:
          name: typescript-types
          path: packages/typescript-types/

      - name: Commit generated TypeScript types
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/typescript-types/src/
          git diff --cached --quiet || git commit -m "chore: regenerate TypeScript types [skip ci]"
          git push

  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Generate API documentation
        run: bash generators/generate_docs.sh

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/

      - name: Deploy docs to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "docs: update generated API documentation [skip ci]"
